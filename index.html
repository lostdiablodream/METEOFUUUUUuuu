<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1f4f7">
  <title>МетеоЦентр — дашборд погоды и климата</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <a class="skip-link" href="#dashboard">К списку виджетов</a>

  <header class="app-header">
    <div class="app-header__inner">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
        </svg>
        <div>
          <h1>МетеоЦентр</h1>
          <p class="app-subtitle">Погода, качество воздуха и дневник наблюдений</p>
        </div>
      </div>
      <nav class="toolbar" aria-label="Добавление виджетов">
        <button class="btn" data-add-widget="weather">+ Погода</button>
        <button class="btn" data-add-widget="air">+ Качество воздуха</button>
        <button class="btn" data-add-widget="notes">+ Наблюдения</button>
        <button class="btn" data-add-widget="quote">+ Цитата</button>
      </nav>
    </div>
  </header>

  <main id="dashboard" class="dashboard"></main>

  <footer class="app-footer">
    Погода и качество воздуха — данные Open-Meteo. Наблюдения хранятся локально через /api/notes.
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
